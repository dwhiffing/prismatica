<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Lathe Model Editor</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0a0e12; color: #9fb; font: 13px/1.5 monospace; }
  #wrap { display: grid; grid-template-columns: 340px 1fr; grid-template-rows: 1fr auto; height: 100vh; }
  #profile { grid-row: 1; border-right: 1px solid #1c2a33; position: relative; }
  #view { grid-row: 1; grid-column: 2; position: relative; }
  #out { grid-column: 1 / 3; grid-row: 2; border-top: 1px solid #1c2a33; padding: 8px 10px; background: #0d141a; }
  canvas { display: block; width: 100%; height: 100%; }
  .bar { position: absolute; top: 0; left: 0; right: 0; padding: 6px 8px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; user-select: none; }
  #view .bar { justify-content: flex-end; }
  button, select { background: #16222c; color: #9fb; border: 1px solid #2c4; border-radius: 3px; padding: 3px 8px; cursor: pointer; font: inherit; }
  button:hover { background: #1d3040; }
  button.a { background: #2c4; color: #000; }
  label { display: inline-flex; gap: 4px; align-items: center; }
  input[type=range] { width: 90px; }
  #hint { position: absolute; bottom: 6px; left: 8px; color: #567; font-size: 11px; }
  #snippet { color: #cfe; white-space: pre-wrap; word-break: break-all; margin: 6px 0 0; user-select: all; }
  #copy { float: right; }
  b.k { color: #fd4; }
</style>
</head>
<body>
<div id="wrap">
  <div id="profile">
    <div class="bar">
      <label>model
        <select id="model"></select>
      </label>
      <button id="add">+ point</button>
      <button id="del">– point</button>
      <label>seg <input type="range" id="seg" min="3" max="24" value="8"><span id="segv">8</span></label>
    </div>
    <canvas id="pc"></canvas>
    <div id="hint">drag points · click empty space near the curve to insert · shift-click a point to delete</div>
  </div>
  <div id="view">
    <div class="bar">
      <label><input type="checkbox" id="wire"> wireframe</label>
      <button id="reset3d">reset view</button>
    </div>
    <canvas id="vc"></canvas>
  </div>
  <div id="out">
    <button id="copy">copy snippet</button>
    <div><b class="k" id="curname">S</b>: current model — paste over the matching line in <b class="k">MODELS</b></div>
    <div id="snippet"></div>
  </div>
</div>
<script>
// ------- seed models (kept in sync with src/game.ts MODELS) -------
const MODELS = {
  S: { p: [[0,0],[10,0],[11,4],[8,9],[4,13],[0,15]], seg: 10, name: 'solar dome' },
  L: { p: [[0,0],[3,0],[4,3],[3,12],[5,14],[0,15]], seg: 6, name: 'link pylon' },
  M: { p: [[0,0],[9,0],[9,5],[5,7],[3,9],[2,16],[0,18]], seg: 8, name: 'miner drill' },
  T: { p: [[0,0],[8,0],[8,6],[5,8],[5,18],[3,19],[3,22],[0,22]], seg: 8, name: 'tower barrel' },
  N: { p: [[0,0],[6,3],[9,7],[5,11],[0,16]], seg: 5, name: 'crystal' },
  E: { p: [[0,0],[7,4],[8,8],[5,12],[0,14]], seg: 7, name: 'enemy blob' },
};
const COL = { S:'#fd4', L:'#4cf', M:'#4f8', T:'#f66', N:'#c9f', E:'#f2a' };
let cur = 'S';

// ------- lathe (same algorithm as the game) -------
function lathe(profile, seg) {
  const verts = [];
  for (let i = 0; i < seg; i++) {
    const a = i / seg * Math.PI * 2, ca = Math.cos(a), sa = Math.sin(a);
    for (const [r, h] of profile) verts.push([r * ca, h, r * sa]);
  }
  const faces = [], P = profile.length;
  for (let i = 0; i < seg; i++) {
    const ni = (i + 1) % seg;
    for (let j = 0; j < P - 1; j++) faces.push([i*P+j, ni*P+j, ni*P+j+1, i*P+j+1]);
  }
  return { verts, faces };
}

// ================= PROFILE EDITOR (left) =================
const pc = document.getElementById('pc'), px = pc.getContext('2d');
// profile space: radius (x, 0..R_MAX) horizontal, height (y, 0..H_MAX) vertical (up)
let PAD = 40, PPU = 8; // pixels per unit
let drag = -1;

function fitPPU() { // scale so the tallest/widest point of the current model fills the panel
  const P = MODELS[cur].p; let mx = 1;
  for (const [r,h] of P) mx = Math.max(mx, r, h);
  const availH = pc.clientHeight - PAD - 20, availW = pc.clientWidth - PAD - 20;
  PPU = Math.max(4, Math.min(availH, availW) / (mx * 1.15));
}
function pcResize() { pc.width = pc.clientWidth * devicePixelRatio; pc.height = pc.clientHeight * devicePixelRatio; px.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); fitPPU(); drawProfile(); }
// map profile (r,h) -> canvas px. height grows upward from a baseline near bottom.
function p2c(r, h) { return [PAD + r * PPU, pc.clientHeight - PAD - h * PPU]; }
function c2p(cx, cy) { return [(cx - PAD) / PPU, (pc.clientHeight - PAD - cy) / PPU]; }

function drawProfile() {
  const w = pc.clientWidth, hgt = pc.clientHeight;
  px.clearRect(0,0,w,hgt);
  // axes
  px.strokeStyle = '#1c2a33'; px.lineWidth = 1;
  px.beginPath(); px.moveTo(PAD,10); px.lineTo(PAD,hgt-PAD); px.lineTo(w-10,hgt-PAD); px.stroke();
  px.fillStyle = '#456'; px.fillText('radius →', w-70, hgt-PAD+16); px.save();
  px.translate(14, 60); px.rotate(-Math.PI/2); px.fillText('height →', 0, 0); px.restore();
  // grid ticks every 5 units
  px.strokeStyle = '#121b22';
  for (let u=5; u<40; u+=5){ const [gx]=p2c(u,0); px.beginPath();px.moveTo(gx,10);px.lineTo(gx,hgt-PAD);px.stroke();
    const [,gy]=p2c(0,u); px.beginPath();px.moveTo(PAD,gy);px.lineTo(w-10,gy);px.stroke(); }
  const P = MODELS[cur].p;
  // mirror curve (show the lathe silhouette) faint on -radius side
  px.strokeStyle = '#243'; px.beginPath();
  P.forEach(([r,h],i)=>{ const [x,y]=p2c(-r,h); i?px.lineTo(x,y):px.moveTo(x,y); }); px.stroke();
  // profile line
  px.strokeStyle = COL[cur]; px.lineWidth = 2; px.beginPath();
  P.forEach(([r,h],i)=>{ const [x,y]=p2c(r,h); i?px.lineTo(x,y):px.moveTo(x,y); }); px.stroke();
  // points
  P.forEach(([r,h],i)=>{ const [x,y]=p2c(r,h);
    px.fillStyle = i===drag ? '#fff' : COL[cur];
    px.beginPath(); px.arc(x,y,5,0,7); px.fill();
    px.fillStyle='#567'; px.fillText(`${r},${h}`, x+8, y-6);
  });
}

function nearestPoint(cx, cy) {
  const P = MODELS[cur].p; let best=-1, bd=12*12;
  P.forEach(([r,h],i)=>{ const [x,y]=p2c(r,h); const d=(x-cx)**2+(y-cy)**2; if(d<bd){bd=d;best=i;} });
  return best;
}
pc.addEventListener('pointerdown', e => {
  const b = pc.getBoundingClientRect(), cx=e.clientX-b.left, cy=e.clientY-b.top;
  const i = nearestPoint(cx, cy);
  if (i>=0 && e.shiftKey) { if (MODELS[cur].p.length>2){ MODELS[cur].p.splice(i,1); refresh(); } return; }
  if (i>=0) { drag=i; pc.setPointerCapture(e.pointerId); drawProfile(); return; }
  // insert a point at click, into the segment whose midpoint is closest
  const P = MODELS[cur].p; let seg=0, bd=1e9;
  for (let k=0;k<P.length-1;k++){ const [ax,ay]=p2c(...P[k]),[bx,by]=p2c(...P[k+1]); const mx=(ax+bx)/2,my=(ay+by)/2; const d=(mx-cx)**2+(my-cy)**2; if(d<bd){bd=d;seg=k;} }
  let [r,h]=c2p(cx,cy); r=Math.max(0,Math.round(r)); h=Math.round(h);
  P.splice(seg+1,0,[r,h]); refresh();
});
pc.addEventListener('pointermove', e => {
  if (drag<0) return;
  const b = pc.getBoundingClientRect();
  let [r,h] = c2p(e.clientX-b.left, e.clientY-b.top);
  r = Math.max(0, Math.round(r*2)/2); h = Math.round(h*2)/2; // snap to 0.5
  MODELS[cur].p[drag] = [r, h]; refresh();
});
pc.addEventListener('pointerup', e => { drag=-1; pc.releasePointerCapture?.(e.pointerId); drawProfile(); updateSnippet(); });

// ================= 3D PREVIEW (right, orbit) =================
const vc = document.getElementById('vc'), vx = vc.getContext('2d');
let yaw = 0.7, pitch = 0.5, zoom = 6, wire = false;
function vcResize() { vc.width = vc.clientWidth*devicePixelRatio; vc.height = vc.clientHeight*devicePixelRatio; vx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }

function rot(v) { // apply yaw (around y) then pitch (around x)
  let [x,y,z] = v;
  let cx=Math.cos(yaw), sx=Math.sin(yaw); [x,z]=[x*cx - z*sx, x*sx + z*cx];
  let cp=Math.cos(pitch), sp=Math.sin(pitch); [y,z]=[y*cp - z*sp, y*sp + z*cp];
  return [x,y,z];
}
const LIGHT = (()=>{ const v=[-0.4,1,0.6],l=Math.hypot(...v); return v.map(c=>c/l); })();
function tint(hex,f){ let r,g,b; if(hex.length===4){r=parseInt(hex[1],16)*17;g=parseInt(hex[2],16)*17;b=parseInt(hex[3],16)*17;} else {r=parseInt(hex.slice(1,3),16);g=parseInt(hex.slice(3,5),16);b=parseInt(hex.slice(5,7),16);} const c=n=>Math.min(255,n*f)|0; return `rgb(${c(r)},${c(g)},${c(b)})`; }

function drawView() {
  const w = vc.clientWidth, hgt = vc.clientHeight;
  vx.fillStyle = '#0a0e12'; vx.fillRect(0,0,w,hgt);
  const m = lathe(MODELS[cur].p, +MODELS[cur].seg);
  // center model vertically around its mid-height
  let maxh = 0; for (const [,h] of MODELS[cur].p) maxh = Math.max(maxh,h);
  const cy0 = maxh/2;
  const proj = v => { const [x,y,z] = rot([v[0], v[1]-cy0, v[2]]); return [w/2 + x*zoom, hgt/2 - y*zoom, z]; };
  // ground grid
  vx.strokeStyle = '#131c24';
  for (let g=-20; g<=20; g+=5) {
    const a = proj([g,0,-20]), b = proj([g,0,20]), c = proj([-20,0,g]), d = proj([20,0,g]);
    vx.beginPath(); vx.moveTo(a[0],a[1]); vx.lineTo(b[0],b[1]); vx.moveTo(c[0],c[1]); vx.lineTo(d[0],d[1]); vx.stroke();
  }
  // faces with depth sort + flat shading
  const base = COL[cur];
  const flist = m.faces.map(f => {
    const wv = f.map(i => m.verts[i]);
    const pv = wv.map(proj);
    const ax=wv[1][0]-wv[0][0],ay=wv[1][1]-wv[0][1],az=wv[1][2]-wv[0][2];
    const bx=wv[2][0]-wv[0][0],by=wv[2][1]-wv[0][1],bz=wv[2][2]-wv[0][2];
    let nx=ay*bz-az*by, ny=az*bx-ax*bz, nz=ax*by-ay*bx; const nl=Math.hypot(nx,ny,nz)||1; nx/=nl;ny/=nl;nz/=nl;
    // rotate normal into view space for lighting consistency with camera
    const rn = rot([nx,ny,nz]);
    const dot = rn[0]*LIGHT[0]+rn[1]*LIGHT[1]+rn[2]*LIGHT[2];
    const shade = tint(base, 0.4 + 0.6*Math.max(0,Math.abs(dot)));
    const depth = (pv[0][2]+pv[1][2]+pv[2][2]+pv[3][2])/4;
    return { pv, shade, depth };
  });
  flist.sort((a,b)=>a.depth-b.depth);
  for (const f of flist) {
    vx.beginPath();
    f.pv.forEach((p,i)=> i?vx.lineTo(p[0],p[1]):vx.moveTo(p[0],p[1]));
    vx.closePath();
    if (wire) { vx.strokeStyle = f.shade; vx.stroke(); }
    else { vx.fillStyle = f.shade; vx.fill(); vx.strokeStyle='rgba(0,0,0,.25)'; vx.stroke(); }
  }
  // vertices as dots
  vx.fillStyle = '#fff';
  for (const v of m.verts) { const p = proj(v); vx.beginPath(); vx.arc(p[0],p[1],1.5,0,7); vx.fill(); }
}

// orbit + zoom controls
let odrag=false, ox=0, oy=0;
vc.addEventListener('pointerdown', e=>{ odrag=true; ox=e.clientX; oy=e.clientY; vc.setPointerCapture(e.pointerId); });
vc.addEventListener('pointermove', e=>{ if(!odrag)return; yaw += (e.clientX-ox)*0.01; pitch += (e.clientY-oy)*0.01; pitch=Math.max(-1.5,Math.min(1.5,pitch)); ox=e.clientX; oy=e.clientY; drawView(); });
vc.addEventListener('pointerup', e=>{ odrag=false; vc.releasePointerCapture?.(e.pointerId); });
vc.addEventListener('wheel', e=>{ e.preventDefault(); zoom=Math.max(2,Math.min(30, zoom*(e.deltaY<0?1.1:1/1.1))); drawView(); });

// ================= UI wiring =================
const modelSel = document.getElementById('model');
for (const k in MODELS) { const o=document.createElement('option'); o.value=k; o.textContent=`${k} — ${MODELS[k].name}`; modelSel.appendChild(o); }
modelSel.onchange = () => { cur = modelSel.value; syncSeg(); fitPPU(); refresh(); };
const segEl = document.getElementById('seg'), segv = document.getElementById('segv');
function syncSeg(){ segEl.value = MODELS[cur].seg; segv.textContent = MODELS[cur].seg; }
segEl.oninput = () => { MODELS[cur].seg = +segEl.value; segv.textContent = segEl.value; refresh(); };
document.getElementById('add').onclick = () => { const P=MODELS[cur].p; const [r,h]=P[P.length-1]; P.push([r,h+2]); refresh(); };
document.getElementById('del').onclick = () => { if(MODELS[cur].p.length>2){ MODELS[cur].p.pop(); refresh(); } };
document.getElementById('wire').onchange = e => { wire = e.target.checked; drawView(); };
document.getElementById('reset3d').onclick = () => { yaw=0.7; pitch=0.5; zoom=6; drawView(); };
document.getElementById('curname').textContent = cur;

function updateSnippet() {
  const P = MODELS[cur].p.map(([r,h]) => `[${r},${h}]`).join(',');
  const line = `  ${cur}: lathe([${P}], ${MODELS[cur].seg}),`;
  document.getElementById('snippet').textContent = line;
  document.getElementById('curname').textContent = cur;
}
document.getElementById('copy').onclick = () => {
  navigator.clipboard.writeText(document.getElementById('snippet').textContent.trim());
  const b=document.getElementById('copy'); b.textContent='copied!'; setTimeout(()=>b.textContent='copy snippet',900);
};

function refresh() { drawProfile(); drawView(); updateSnippet(); }
function resizeAll() { pcResize(); vcResize(); drawView(); }
addEventListener('resize', resizeAll);
syncSeg(); resizeAll(); refresh();
</script>
</body>
</html>
